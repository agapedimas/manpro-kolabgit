<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kenjo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 20px;
            background: #f3f5f2;
            color: #26352c;
            font-family: Arial, sans-serif;
        }

        .profile {
            width: min(100%, 680px);
            margin: 0 auto;
            padding: 36px;
            border: 1px solid #e4e9e3;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 35px rgba(38, 53, 44, 0.07);
        }

        .intro {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-bottom: 28px;
            border-bottom: 1px solid #e8ece8;
        }

        .intro img {
            width: 130px;
            height: 130px;
            flex: 0 0 auto;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 25%;
        }

        .intro p {
            margin: 0 0 8px;
            color: #61806b;
            font-size: 13px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
        }

        .intro .description {
            margin: 10px 0 0;
            color: #68746d;
            font-size: 15px;
            line-height: 1.6;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            padding-top: 24px;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        ul {
            margin: 0;
            padding-left: 20px;
            color: #56645b;
            line-height: 1.9;
        }

        .secret {
            margin-top: 28px;
            text-align: center;
        }

        .secret button {
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            background: #61806b;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .secret button:hover {
            background: #4d6c57;
        }

        .secret-image {
            display: block;
            max-width: 100%;
            max-height: 420px;
            margin: 16px auto 0;
            border-radius: 10px;
            object-fit: contain;
        }

        .secret-image[hidden] {
            display: none;
        }

        @media (max-width: 520px) {
            body {
                padding: 24px 14px;
            }

            .profile {
                padding: 24px 20px;
            }

            .intro {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .intro img {
                width: 110px;
                height: 110px;
            }

            h1 {
                font-size: 30px;
            }

            .info {
                grid-template-columns: 1fr;
                gap: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="profile">
        <section class="intro" aria-labelledby="profile-name">
            <img src="./assets/foto-kenjo.jpg" alt="Foto Kenjo">
            <div>
                <h1 id="profile-name">Halo, aku Kenjo!</h1>
                <p class="description">Ini sedikit tentang hobi dan keahlian saya.</p>
            </div>
        </section>

        <section class="info" aria-label="Informasi Kenjo">
            <div>
                <h2>Hobi</h2>
                <ul>
                    <li>Badminton</li>
                    <li>Menonton Film</li>
                    <li>Bermain Game</li>
                </ul>
            </div>
            <div>
                <h2>Keahlian</h2>
                <ul>
                    <li>Web Development</li>
                    <li>Graphic Design</li>
                </ul>
            </div>
        </section>

        <div class="secret">
            <button type="button" aria-expanded="false" aria-controls="secret-image">
                Rahasia
            </button>
            <img class="secret-image" id="secret-image" src="./assets/tampil.jpg"
                alt="Gambar rahasia" hidden>
        </div>
    </main>
    <script>
        const secretButton = document.querySelector(".secret button");
        const secretImage = document.querySelector("#secret-image");

        secretButton.addEventListener("click", () => {
            const isExpanded = secretButton.getAttribute("aria-expanded") === "true";
            secretButton.setAttribute("aria-expanded", String(!isExpanded));
            secretImage.hidden = isExpanded;
            secretButton.textContent = isExpanded ? "Rahasia" : "Tutup rahasia";
        });
    </script>
</body>
</html>
